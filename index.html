<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Astrid Lucile · Architecture, construction estimating, and project coordination in Orlando, Florida.">
<title>Astrid Lucile | Digital Business Card</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:#e9eee7;color:#172e27;font:1rem/1.55 system-ui,sans-serif}
main{width:min(100%,30rem);background:#faf9f3;border:1px solid #bdc9be;border-radius:22px;overflow:hidden;box-shadow:0 24px 60px #172e271c}
.banner{display:flex;align-items:end;padding:24px 28px;min-height:145px;background:repeating-linear-gradient(90deg,transparent 0 27px,#ffffff18 27px 28px),repeating-linear-gradient(0deg,transparent 0 27px,#ffffff18 27px 28px),#174536}
.mark{display:grid;place-items:center;width:65px;height:65px;background:#e6ebc6;border-radius:50%;font:1.65rem Georgia,serif}
.details{padding:24px 28px 30px}
.location{margin:0;font-size:.75rem;letter-spacing:.15em;text-transform:uppercase;color:#455d50}
h1{margin:.25em 0 .18em;font:clamp(2.5rem,10vw,4rem)/1 Georgia,serif;letter-spacing:-.06em}
.role{margin:0;color:#174536;font-weight:650}
.intro{margin:16px 0 24px;color:#455d50}
.action{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:54px;padding:12px 16px;border-radius:10px;background:#174536;color:white;text-decoration:none;font-weight:650}
.action:hover{background:#235842}
a:focus-visible{outline:3px solid #8b500a;outline-offset:4px}
</style>
</head>
<body>
<main aria-labelledby="name">
<div class="banner" aria-hidden="true"><span class="mark">AL</span></div>
<div class="details">
<p class="location">Orlando, Florida</p>
<h1 id="name">Astrid Lucile</h1>
<p class="role">Construction Estimating &amp; Project Coordination</p>
<p class="intro">I have a background in architecture and work in construction. I’m interested in how design and construction can make public spaces more welcoming and easier to get around.</p>
<a class="action" href="./astrid-lucile.vcf">Save my contact <span aria-hidden="true">↓</span></a>
</div>
</main>
</body>
</html>
